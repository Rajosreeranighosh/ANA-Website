<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<meta name="description" content="The requested ANA Blockchain page could not be found.">
<meta name="color-scheme" content="dark">
<title>Page Not Found — ANA Blockchain</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
:root{color-scheme:dark;--bg:#090d18;--line:#25334b;--text:#edf3ff;--muted:#9eacc4;--cyan:#63e4df}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 70% 15%,#173454 0,transparent 40%),var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}.panel{width:min(620px,100%);padding:clamp(26px,6vw,48px);border:1px solid var(--line);border-radius:20px;background:#111a2bdd}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #63e4df88;border-radius:12px;color:var(--cyan);font-weight:900}.eyebrow{margin-top:32px;color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}h1{margin:8px 0;font-size:clamp(42px,9vw,68px);line-height:1.05;letter-spacing:-.05em}.muted{color:var(--muted)}a{display:inline-block;margin-top:14px;padding:11px 17px;border:1px solid var(--cyan);border-radius:9px;background:var(--cyan);color:#07131c;text-decoration:none;font-weight:750}
</style>
</head>
<body>
<main class="panel">
<div class="mark" aria-hidden="true">A</div>
<div class="eyebrow">Error 404</div>
<h1>Page not found.</h1>
<p class="muted">That address does not match a page on the ANA Blockchain website. The project is experimental; check the development status for verified progress.</p>
<a href="index.html">Return to ANA home</a>
</main>
</body>
</html>
